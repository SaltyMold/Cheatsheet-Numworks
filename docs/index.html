<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cheatsheet image converter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <input id="fileInput" type="file" accept="image/*" multiple hidden>

    <!-- Toolbar -->
    <header class="toolbar">
      <div class="group">
        <button class="btn primary" id="openBtn" title="Add one or more images (or drop them on the original)">Add images</button>
      </div>
      <div class="group">
        <button class="btn" id="undoBtn" title="Undo (Ctrl+Z)">Undo</button>
        <button class="btn" id="redoBtn" title="Redo">Redo</button>
      </div>
      <div class="group">
        <button class="btn" id="cropBtn">Crop</button>
        <button class="btn" id="rotateBtn">Rotate 90°</button>
        <button class="btn" id="rotateCustomBtn">Rotate…</button>
        <button class="btn" id="flipHBtn" title="Flip horizontally">Flip H</button>
        <button class="btn" id="flipVBtn" title="Flip vertically">Flip V</button>
      </div>
      <div class="group">
        <button class="btn" id="frontBtn" title="Bring forward">Forward</button>
        <button class="btn" id="backBtn" title="Send backward">Backward</button>
        <button class="btn" id="deleteBtn" title="Remove image (Delete)">Remove</button>
      </div>
      <div class="spacer"></div>
      <div class="group">
        <button class="btn" id="downloadPreviewBtn">Export PNG</button>
        <button class="btn primary" id="downloadBtn" title="Export .bin (Ctrl+S)">Export .bin</button>
      </div>
    </header>

    <!-- Canvases -->
    <main class="panes">
      <section class="pane">
        <div class="pane-head">
          <h2>Original</h2>
          <span class="badge" id="origSize">—</span>
        </div>
        <div class="canvas-wrapper">
          <canvas id="orig" width="640" height="480"></canvas>
          <canvas id="overlay" aria-hidden="true"></canvas>
        </div>
      </section>

      <section class="pane">
        <div class="pane-head">
          <h2>Preview</h2>
          <span class="badge" id="previewSize">—</span>
        </div>
        <div class="canvas-wrapper preview-wrapper">
          <canvas id="preview" width="1280" height="960"></canvas>
          <canvas id="lens" width="200" height="200" class="magnifier" aria-hidden="true"></canvas>
        </div>
      </section>
    </main>

    <!-- Settings + status -->
    <footer class="settings">
      <div class="field">
        <label for="colors">Colors <output id="colorsVal">16</output></label>
        <input id="colors" type="range" min="2" max="16" value="16">
      </div>
      <label class="check">
        <input id="invert" type="checkbox">
        <span>Invert</span>
      </label>
      <div class="field">
        <label for="sizeRange">Tiles <output id="sizeVal">4</output> <small>320×240 each</small></label>
        <input id="sizeRange" type="range" min="1" max="12" value="4">
      </div>
      <dl class="stats">
        <div><dt>Output</dt><dd id="outputSize">1280×960</dd></div>
        <div><dt>.bin size</dt><dd id="binSize">0 B</dd></div>
      </dl>
      <p class="status" id="statusText" role="status">Ready. Add images to start; click one to select it, then use the tools.</p>
    </footer>

    <!-- Crop modal -->
    <div id="cropModal" class="modal" aria-hidden="true">
      <div class="modal-overlay"></div>
      <div class="modal-dialog" role="dialog" aria-label="Crop image">
        <div class="modal-head">
          <h2>Crop image</h2>
          <button class="icon-btn" id="cropCancel" aria-label="Close">&times;</button>
        </div>
        <div class="modal-body">
          <canvas id="cropCanvas"></canvas>
        </div>
        <div class="modal-foot">
          <span class="hint">Drag on the image to select the area to keep.</span>
          <button class="btn" id="cropCancel2">Cancel</button>
          <button class="btn primary" id="cropConfirm">Apply</button>
        </div>
      </div>
    </div>

    <!-- Rotation modal -->
    <div id="rotateModal" class="modal" aria-hidden="true">
      <div class="modal-overlay"></div>
      <div class="modal-dialog" role="dialog" aria-label="Rotate image">
        <div class="modal-head">
          <h2>Rotate image</h2>
          <button class="icon-btn" id="rotateCancel" aria-label="Close">&times;</button>
        </div>
        <div class="modal-body">
          <canvas id="rotateCanvas"></canvas>
        </div>
        <div class="modal-controls">
          <label for="rotateAngle">Angle <output id="rotateAngleVal">0</output>°</label>
          <input id="rotateAngle" type="range" min="-180" max="180" value="0" step="1">
        </div>
        <div class="modal-foot">
          <button class="btn" id="rotateCancel2">Cancel</button>
          <button class="btn primary" id="rotateConfirm">Apply</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
